<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="./styles/chores.css">
  <link rel="stylesheet" href="./styles/style.css">

  <script defer src="./script.js"></script>

  <title>Frontend Mentor | Newsletter sign-up form with success message</title>

</head>

<body>

  <article class="sign-up">
    <div class="image">
      <picture>
        <source media="(min-width: 60rem)" srcset="./assets/images/illustration-sign-up-desktop.svg" alt="" />
        <source media="(min-width: 40rem)" srcset="./assets/images/illustration-sign-up-tablet.svg" alt="" />
        <img src="./assets/images/illustration-sign-up-mobile.svg" alt="">
      </picture>
    </div>
    <div class="content">
      <div class="text-content">
        <h1>
          Stay updated!
        </h1>
        <p>
          Join 60,000+ product managers receiving monthly updates on:
        </p>
        <ul>
          <li>
            Product discovery and building what matters
          </li>
          <li>
            Measuring to ensure updates are a success
          </li>
          <li>
            And much more!
          </li>
        </ul>
      </div>

      <form novalidate>
        <div class="form-field">
          <div class="error">
            <label for="email">Email address</label>
            <p id="email-error" aria-live="polite">Valid email required</p>
          </div>
          <input type="email" id="email" name="email" placeholder="email@company.com" autocomplete="email"
            aria-describedby="email-error" required />
        </div>
        <button type="submit">Subscribe to monthly newsletter</button>
      </form>

    </div>

  </article>

  <!-- <article class="success">
    Thanks for subscribing!

    A confirmation email has been sent to ash@loremcompany.com.
    Please open it and click the button inside to confirm your subscription.

    Dismiss message
  </article> -->

</body>

</html>
